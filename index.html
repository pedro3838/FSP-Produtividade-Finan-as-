<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>FlowSpace Pro • Produtividade Executiva</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    
    body { 
      margin: 0; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #05070a; 
      color: #eef2fb; 
      min-height: 100vh; 
      position: relative; 
      overflow-x: hidden; 
    }

    .animated-bg { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: -2; 
      background: radial-gradient(ellipse at 30% 40%, #13203a, #020304); 
      background-size: 200% 200%; 
      animation: bgFlow 18s ease infinite; 
    }
    
    @keyframes bgFlow { 
      0% { background-position: 0% 0%; } 
      50% { background-position: 100% 100%; } 
      100% { background-position: 0% 0%; } 
    }

    .particles { 
      position: fixed; 
      width: 100%; 
      height: 100%; 
      z-index: -1; 
      background-image: 
        radial-gradient(2px 2px at 20% 40%, rgba(100, 210, 255, 0.3), transparent),
        radial-gradient(2px 2px at 80% 70%, rgba(180, 140, 255, 0.2), transparent),
        radial-gradient(3px 3px at 40% 80%, rgba(80, 200, 120, 0.2), transparent);
      background-size: 200px 200px;
      animation: drift 40s linear infinite;
      opacity: 0.5;
    }
    
    @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-200px, -100px); } }

    .glass-panel { 
      backdrop-filter: blur(16px) saturate(180%); 
      background: rgba(10, 18, 28, 0.55); 
      border: 1px solid rgba(79, 156, 247, 0.2); 
      border-radius: 28px; 
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4); 
    }

    header { 
      padding: 16px 28px; 
      margin: 20px 24px 16px 24px; 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      flex-wrap: wrap;
      border-radius: 80px; 
      background: rgba(6, 14, 24, 0.7); 
      border: 1px solid rgba(79, 156, 247, 0.3); 
    }

    header h2 { 
      font-weight: 700; 
      font-size: 1.8rem; 
      background: linear-gradient(135deg, #ffffff, #b8d4ff, #6aafe8);
      -webkit-background-clip: text; 
      background-clip: text; 
      color: transparent; 
    }

    .datetime-display { 
      margin-left: auto; 
      padding: 8px 20px; 
      background: rgba(79, 156, 247, 0.1); 
      border-radius: 40px; 
      font-size: 0.85rem; 
      color: #bbd4ff; 
      border: 1px solid rgba(79, 156, 247, 0.25); 
    }

    .dashboard { padding: 24px 26px; margin: 8px 24px 20px 24px; }
    
    .filters { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
    
    .select-custom { 
      padding: 10px 20px; 
      border-radius: 60px; 
      background: rgba(18, 28, 40, 0.8); 
      border: 1px solid rgba(79, 156, 247, 0.3); 
      color: #f0f6ff; 
      cursor: pointer; 
      outline: none; 
    }

    canvas { 
      background: rgba(0, 0, 0, 0.2); 
      border-radius: 24px; 
      padding: 12px; 
      border: 1px solid rgba(79, 156, 247, 0.2); 
      width: 100%;
      max-height: 320px;
    }

    .week-nav { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin: 16px 24px; 
      padding: 16px 24px; 
      background: rgba(79, 156, 247, 0.08); 
      border-radius: 60px; 
      border: 1px solid rgba(79, 156, 247, 0.25); 
    }

    .container { padding: 8px 24px 40px 24px; display: flex; flex-direction: column; gap: 20px; }

    .day { 
      background: rgba(16, 26, 40, 0.5); 
      border: 1px solid rgba(79, 156, 247, 0.2); 
      border-radius: 28px; 
      padding: 22px 24px; 
    }

    .day h3 { 
      font-size: 1.4rem; 
      display: flex; 
      align-items: center; 
      color: #dfebff; 
      border-bottom: 1px solid rgba(79, 156, 247, 0.3); 
      padding-bottom: 10px; 
      margin-bottom: 18px;
    }

    .day-date { font-size: 0.8rem; color: #4f9cf7; margin-left: auto; background: rgba(79,156,247,0.15); padding: 4px 12px; border-radius: 40px; }

    .task { 
      display: flex; 
      align-items: center; 
      background: rgba(0, 0, 0, 0.2); 
      padding: 8px 14px; 
      border-radius: 60px; 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      margin-bottom: 10px;
    }

    .task input[type="text"] { 
      background: transparent; 
      border: none; 
      color: #f0f7ff; 
      width: 100%; 
      padding: 8px 6px; 
      outline: none;
    }

    .add-task-area { 
      margin-top: 20px; 
      display: flex; 
      gap: 12px; 
      border-top: 1px solid rgba(79, 156, 247, 0.2); 
      padding-top: 20px; 
      flex-wrap: wrap; 
    }

    .add-task-area input { 
      background: rgba(0, 10, 20, 0.6); 
      border: 1px solid rgba(79, 156, 247, 0.3); 
      border-radius: 60px; 
      padding: 12px 18px; 
      color: #fff; 
      flex: 2;
    }

    .btn-primary { 
      padding: 10px 24px; 
      background: linear-gradient(145deg, #1f8b4c, #0e6b3e); 
      border: none; 
      color: white; 
      border-radius: 60px; 
      font-weight: 600; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px;
    }

    .agenda-section { margin: 20px 24px; padding: 24px 28px; }
    .agenda-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .agenda-item { background: rgba(255, 255, 255, 0.04); padding: 14px; border-radius: 20px; border: 1px solid rgba(79, 156, 247, 0.15); display: flex; flex-direction: column; gap: 10px; }
    .agenda-item input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 14px; border-radius: 16px; }

    #notification-popup { 
      position: fixed; bottom: 24px; right: 24px; background: #1e3a5f; 
      border-left: 5px solid #4f9cf7; padding: 18px 26px; border-radius: 20px; display: none; z-index: 9999; 
    }
  </style>
</head>
<body>
  <div class="animated-bg"></div>
  <div class="particles"></div>

  <header class="glass-panel">
    <i class="fas fa-bolt" style="color: #4f9cf7;"></i>
    <h2>FlowSpace Pro</h2>
    <div id="real-time" class="datetime-display">Carregando...</div>
  </header>

  <div class="dashboard glass-panel">
    <div class="filters">
      <select id="filterMonth" class="select-custom"></select>
      <select id="filterCategory" class="select-custom"></select>
      <button class="btn-primary" onclick="manageCategories()" style="background: rgba(79,156,247,0.1); border: 1px solid rgba(79,156,247,0.3);">
        <i class="fas fa-tags"></i> Categorias
      </button>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <div class="week-nav glass-panel">
    <button class="btn-primary" style="background: rgba(79,156,247,0.15);" onclick="changeWeek(-1)">
      <i class="fas fa-chevron-left"></i> Anterior
    </button>
    <span id="current-week-label" style="font-weight: 600; color: #a0c8ff;"></span>
    <button class="btn-primary" onclick="changeWeek(1)">
      Próxima <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <div class="agenda-section glass-panel">
    <h3><i class="fas fa-clock"></i> Agenda & Lembretes</h3>
    <div id="agenda-container" class="agenda-grid"></div>
    <button class="btn-primary" style="margin-top:15px;" onclick="addAgendaItem()">
      <i class="fas fa-plus"></i> Novo Lembrete
    </button>
  </div>

  <div class="container" id="app"></div>

  <div id="notification-popup">
    <strong style="color: white;"><i class="fas fa-bell"></i> Lembrete!</strong>
    <p id="notif-text" style="color: #bbd4ff; margin-top: 5px;"></p>
    <button onclick="this.parentElement.style.display='none'" style="margin-top:10px; background:transparent; border: 1px solid #4f9cf7; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer;">Fechar</button>
  </div>

  <script>
    (function(){
      "use strict";

      const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const daysLabel = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      
      let db = {}; 
      let categories = ["Estudo", "Profissional", "Saúde"];
      let currentMonth = 3; // Abril
      let currentWeek = 0;
      let agendaItems = [];

      // Inicialização
      function getWeeksInMonth(year, month) {
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        return Math.ceil((lastDate + firstDay) / 7);
      }

      function initDB(mIdx) {
        if (!db[mIdx]) db[mIdx] = {};
        const weeks = getWeeksInMonth(2026, mIdx);
        for(let w=0; w < weeks; w++) {
          if (!db[mIdx][w]) {
            db[mIdx][w] = daysLabel.map(() => []);
          }
        }
      }

      // Gestão de Categorias
      window.manageCategories = function() {
        const action = prompt("Escolha: (1) Adicionar (2) Excluir").trim();
        if (action === "1") {
          const n = prompt("Nova categoria:");
          if (n && !categories.includes(n)) { categories.push(n); renderCategorySelectors(); }
        } else if (action === "2") {
          const d = prompt("Excluir qual?\n" + categories.join(", "));
          if (categories.includes(d)) { categories = categories.filter(c => c !== d); renderCategorySelectors(); }
        }
      };

      function renderCategorySelectors() {
        const filterCat = document.getElementById('filterCategory');
        const saved = filterCat.value;
        filterCat.innerHTML = `<option value="all">🏷️ Todas categorias</option>` + 
          categories.map(c => `<option value="${c}">${c}</option>`).join('');
        filterCat.value = categories.includes(saved) ? saved : "all";
        createUI();
      }

      // Funções Principais
      window.changeWeek = function(dir) {
        const weeks = getWeeksInMonth(2026, currentMonth);
        let nW = currentWeek + dir;
        if (nW >= weeks) { if (currentMonth < 11) { currentMonth++; currentWeek = 0; } }
        else if (nW < 0) { if (currentMonth > 0) { currentMonth--; currentWeek = getWeeksInMonth(2026, currentMonth) - 1; } }
        else { currentWeek = nW; }
        initDB(currentMonth);
        document.getElementById('filterMonth').value = currentMonth;
        createUI();
      };

      window.addTask = function(dayIdx) {
        const input = document.getElementById(`input-${dayIdx}`);
        const cat = document.getElementById(`cat-${dayIdx}`).value;
        if(!input.value.trim()) return;
        db[currentMonth][currentWeek][dayIdx].push({ name: input.value, cat: cat, done: false });
        input.value = "";
        createUI();
      };

      window.toggleTask = function(dIdx, tIdx) {
        db[currentMonth][currentWeek][dIdx][tIdx].done = !db[currentMonth][currentWeek][dIdx][tIdx].done;
        updateStats();
      };

      window.editTask = function(dIdx, tIdx, val) {
        if(val.trim()) db[currentMonth][currentWeek][dIdx][tIdx].name = val;
      };

      // UI e Gráfico
      const chart = new Chart(document.getElementById('chart').getContext('2d'), {
        type: 'line',
        data: {
          labels: daysLabel,
          datasets: [{ label: 'Conclusão', data: [0,0,0,0,0,0,0], borderColor: '#4f9cf7', backgroundColor: 'rgba(79, 156, 247, 0.1)', fill: true, tension: 0.4 }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true, display: false }, x: { ticks: { color: '#c3d6ff' } } } }
      });

      function updateStats() {
        chart.data.datasets[0].data = db[currentMonth][currentWeek].map(day => day.filter(t => t.done).length);
        chart.update();
      }

      function createUI() {
        const app = document.getElementById('app');
        app.innerHTML = '';
        document.getElementById('current-week-label').textContent = `${months[currentMonth]} • Semana ${currentWeek + 1}`;
        
        const catFilter = document.getElementById('filterCategory').value;

        db[currentMonth][currentWeek].forEach((tasks, i) => {
          const firstDay = new Date(2026, currentMonth, 1).getDay();
          const target = new Date(2026, currentMonth, 1);
          target.setDate(target.getDate() + ((currentWeek * 7) + i - firstDay));
          
          const div = document.createElement('div');
          div.className = 'day';
          div.innerHTML = `<h3><i class="far fa-calendar-alt"></i> ${daysLabel[i]} <span class="day-date">${target.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}</span></h3>
            <div class="task-list"></div>
            <div class="add-task-area">
              <input type="text" placeholder="Tarefa..." id="input-${i}">
              <select id="cat-${i}" class="select-custom" style="padding: 5px 10px;">${categories.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
              <button class="btn-primary" onclick="addTask(${i})"><i class="fas fa-plus"></i></button>
            </div>`;
          
          const list = div.querySelector('.task-list');
          tasks.forEach((t, tIdx) => {
            if (catFilter !== "all" && t.cat !== catFilter) return;
            const row = document.createElement('div');
            row.className = 'task';
            row.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i}, ${tIdx})">
                             <input type="text" value="${t.name}" onchange="editTask(${i}, ${tIdx}, this.value)">
                             <small style="color: #4f9cf7; font-size: 0.7rem; margin-left: 5px;">${t.cat}</small>`;
            list.appendChild(row);
          });
          app.appendChild(div);
        });
        updateStats();
      }

      // Relógio e Agenda
      window.addAgendaItem = () => { agendaItems.push({ id: Date.now(), text: '', time: '', notified: false }); renderAgenda(); };
      window.updateAgenda = (id, f, v) => { const it = agendaItems.find(a=>a.id===id); if(it) it[f]=v; };
      function renderAgenda() {
        const c = document.getElementById('agenda-container'); c.innerHTML = '';
        agendaItems.forEach(item => {
          const d = document.createElement('div'); d.className = 'agenda-item';
          d.innerHTML = `<input type="text" value="${item.text}" onchange="updateAgenda(${item.id},'text',this.value)" placeholder="O que fazer?">
                         <input type="time" value="${item.time}" onchange="updateAgenda(${item.id},'time',this.value)">`;
          c.appendChild(d);
        });
      }

      function checkReminders(now) {
        const cur = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        agendaItems.forEach(it => { if(it.time === cur && !it.notified) { 
          document.getElementById('notif-text').textContent = it.text;
          document.getElementById('notification-popup').style.display='block';
          it.notified = true; 
        } });
      }

      // Eventos
      document.getElementById('filterMonth').onchange = (e) => { currentMonth = parseInt(e.target.value); currentWeek = 0; initDB(currentMonth); createUI(); };
      document.getElementById('filterCategory').onchange = createUI;

      // Start
      const fMonth = document.getElementById('filterMonth');
      months.forEach((m, i) => fMonth.add(new Option(m, i)));
      fMonth.value = currentMonth;
      
      initDB(currentMonth);
      renderCategorySelectors();
      setInterval(() => {
        const now = new Date();
        document.getElementById('real-time').textContent = now.toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
        checkReminders(now);
      }, 1000);
    })();
  </script>
</body>
</html>
